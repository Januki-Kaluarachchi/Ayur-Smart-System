<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ayur-Smart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .supplier-fields { display: none; }
    </style>
</head>
<body>

    <div class="login-container" style="max-width: 450px;">
        <h2>Create Account</h2>
        <form id="regForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Enter your name" required>
            </div>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="input-group">
                <label>Register As (Are you a customer or supplier?)</label>
                <select name="role" id="roleSelect" required style="width: 100%; padding: 10px; border-radius: 5px; background: #1b4332; color: white; border: 1px solid #40916c;" onchange="toggleSupplierFields()">
                    <option value="customer">Customer</option>
                    <option value="supplier">Supplier</option>
                </select>
            </div>

       
            <div id="supplierFields" class="supplier-fields">
                <div class="input-group">
                    <label>Company Name</label>
                    <input type="text" name="company_name" placeholder="Enter company name">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone_number" placeholder="Enter phone number">
                </div>
                <div class="input-group">
                    <label>Address</label>
                    <textarea name="address" placeholder="Enter company address" style="width: 100%; padding: 10px; border-radius: 5px; background: #1b4332; color: white; border: 1px solid #40916c; resize: vertical;"></textarea>
                </div>
            </div>
            
            <button type="submit" style="margin-top: 15px;">Register</button>
        </form>

      
        <p style="margin-top: 15px; text-align: center;">
            Are you a doctor? 
            <a href="doctor_register.html" style="color: #4CAF50; font-weight: bold;">Register as a Doctor</a>
        </p>

        <p style="margin-top: 20px; font-size: 0.9rem; text-align: center;">
            Already have an account? 
            <a href="login.html">Login here</a>
        </p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        function toggleSupplierFields() {
            const role = document.getElementById('roleSelect').value;
            const supplierFields = document.getElementById('supplierFields');
            if (role === 'supplier') {
                supplierFields.style.display = 'block';
            } else {
                supplierFields.style.display = 'none';
            }
        }

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            let formData = new FormData(this);

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === "success") {
                    alert("Registration Successful! Welcome to Ayur-Smart.");
                    window.location.href = 'login.html'; 
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => console.error('Error:', error));
        });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = '#b7e4c7';
            }
            update() { 
                this.x += this.speedX; 
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < 50; i++) particles.push(new Particle());
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        init(); 
        animate();
    </script>
</body>
</html>
