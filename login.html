<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ayur-Smart-System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Ayur-Smart Login</h2>
        <form action="login.php" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>

            <p style="margin-top: 20px; font-size: 0.9rem; color: #d8f3dc;">
    Don't have an account? 
    <a href="register.html" style="color: #b7e4c7; text-decoration: none; font-weight: bold;">Register here</a>
</p>
        </form>
    </div>

</body>
</html>
